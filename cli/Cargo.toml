[package]
name = "zed-http-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Safe terminal HTTP runner for Zed .http files"
license = "MIT"

[lib]
name = "zed_http_runner"
path = "src/lib.rs"

[[bin]]
name = "zed-http"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
